    pumpWorkers(token);
  }

  async function loadLocalFolder(fileList) {
    const token = ++sessionToken;
    resetEngineState();

    const imgs = [];
    for (let k = 0; k < fileList.length; k++) {
      const f = fileList[k];
      if (!f.name || f.name.startsWith(".") || !EXT.test(f.name)) continue;
      imgs.push(f);
    }

    if (!imgs.length) {
      st.textContent = "No images found";
      pickTitle.textContent = "No Images Found in Folder";
      pickDesc.textContent = "Please choose a folder containing PNG, JPG, WebP, or SVG images.";
      picker.classList.remove("hidden");
      return;
    }

    imgs.sort((a, b) => a.name.localeCompare(b.name));
    sourceMode = "folder_local";
    localFiles = imgs;
    N = imgs.length;
    sourceId = `dir:${N}:${imgs[0].name}:${imgs[N - 1].name}`;

    st.textContent = "Opening folder…";
    await finalizeLaunch(token);
  }

  async function loadHttpFolder(baseUrl, names) {
    const token = ++sessionToken;
    resetEngineState();

    sourceMode = "folder_http";
    folderBaseUrl = baseUrl.endsWith("/") ? baseUrl : baseUrl + "/";
    folderNames = names;
    N = names.length;
    sourceId = `httpdir:${folderBaseUrl}:${N}:${names[0]}:${names[N - 1]}`;

    await finalizeLaunch(token);
  }

  async function loadZipArchive(src) {
    const token = ++sessionToken;
    try {
      resetEngineState();
      sourceMode = "zip";
      zipSource = src;
      sourceId = src.id;

      st.textContent = "Reading index…";
      pickTitle.textContent = "Opening Archive…";
      pickDesc.textContent = "Just a moment.";

      await readZipIndex(src);
      if (token !== sessionToken) return;

      await finalizeLaunch(token);
    } catch (err) {
      st.textContent = err.message || "Failed to load archive";
      pickTitle.textContent = "Load Image Folder";
      pickDesc.textContent = err.message || "Please choose a folder or .zip file.";
      picker.classList.remove("hidden");
    }
  }

  folderInput.addEventListener("change", e => {
    if (e.target.files && e.target.files.length) {
      loadLocalFolder(e.target.files);
    }
  });

  zipInput.addEventListener("change", e => {
    const f = e.target.files[0];
    if (f) loadZipArchive(createFileSource(f));
  });

  dropCard.addEventListener("dragover", e => {
    e.preventDefault();
    dropCard.style.borderColor = "var(--accent)";
  });
  dropCard.addEventListener("dragleave", () => {
    dropCard.style.borderColor = "var(--line)";
  });
  dropCard.addEventListener("drop", e => {
    e.preventDefault();
    dropCard.style.borderColor = "var(--line)";
    const files = e.dataTransfer.files;
    if (files.length === 1 && files[0].name.toLowerCase().endsWith(".zip")) {
      loadZipArchive(createFileSource(files[0]));
    } else if (files.length > 0) {
      loadLocalFolder(files);
    }
  });

  updateAutoScrollUI();
  updateIdleNote();

  /* ===== Auto-Boot: Manifest JSON -> Folder Listing -> ZIP -> Picker ===== */
  (async () => {
    resize();

    if (location.protocol === "http:" || location.protocol === "https:") {
      st.textContent = "Finding folder…";

      // 1. Check JSON manifests (if generated by make_list.py)
      for (const mUrl of CONFIG.AUTO_MANIFESTS) {
        try {
          const list = await tryFetchManifest(mUrl);
          // Match folder name (e.g. images.json -> images/)
          const folderGuess = mUrl.replace(".json", "/");
          await loadHttpFolder(folderGuess, list);
          return;
        } catch {}
      }

      // 2. Auto-read server directory listing (images/, logos/, 20k/)
      for (const folderUrl of CONFIG.AUTO_FOLDERS) {
        try {
          const { base, files } = await tryFetchDirectoryListing(folderUrl);
          await loadHttpFolder(base, files);
          return;
        } catch {}
      }

      // 3. Fallback to 20k.zip if present
      try {
        const src = await createHttpZipSource(CONFIG.AUTO_ZIP_URL);
        await loadZipArchive(src);
        return;
      } catch {}
    }

    st.textContent = "Select folder";
    picker.classList.remove("hidden");
  })();
})();
</script>
